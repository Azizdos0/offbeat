/* ---------- desktop shell messages ---------- */
host?.addEventListener("message", e => {
  const m = e.data;
  if (m.type==="state"){ S.host = m; if (S.view==="settings") render(); }
  else if (m.type==="files") syncFolder(m.files);
  else if (m.type==="cmd") ({toggle, next:()=>next(), prev})[m.cmd]?.();
  else if (m.type==="mini") root.classList.toggle("mini", m.on);
});

/* ---------- wiring ---------- */
const CMD = {
  toggle, next:()=>next(), prev, shuffle:toggleShuffle, repeat:cycleRepeat, like:()=>setLike(cur()),
  lyrics:()=>toggleDrawer("lyrics"), queue:()=>toggleDrawer("queue"), closeDrawer:()=>{ S.drawer=null; renderDrawer(); },
  sleep:(e,b)=>sleepMenu(b), mini:()=>setMini(!isMini()), fs:()=>toggleFs(),
  mute:()=>setVol(+vol.value ? 0 : lastVol, false),
  themes:openThemes, closeThemes:()=>$("#themeModal").classList.remove("on"),
  addfiles:()=>$("#fileIn").click(), addfolder:()=>$("#dirIn").click(), addlrc:()=>{ if (cur()) $("#lrcIn").click(); },
  newpl:()=>newPlaylist(),
  renamepl: async () => { const p = viewInfo().pl; if (!p) return; const n = await dialog({title:"Rename playlist", input:p.name, ok:"Save"}); if (n){ p.name = n; savePl(p); render(); renderSide(); } },
  deletepl: async () => { const p = viewInfo().pl; if (!p) return; if (await dialog({title:"Delete playlist?", text:`“${p.name}” will be deleted. Your songs stay in your library.`, ok:"Delete", danger:true})){ S.playlists = S.playlists.filter(x=>x!==p); tx("playlists","readwrite",s=>s.delete(p.id)); go("all"); } },
  clearQueue:()=>{ S.upNext = []; renderDrawer(); },
  pickFolder:()=>send({type:"pickFolder"}), rescan:()=>{ send({type:"scan"}); toast("Rescanning your music folder…"); },
  unwatch: async () => {
    if (!await dialog({title:"Stop syncing this folder?", text:"Songs from that folder will leave your library. The files themselves stay where they are.", ok:"Stop syncing", danger:true})) return;
    send({type:"unwatch"});
    for (const t of S.tracks.filter(t=>t.path)) await dropTrack(t);
    render(); renderSide();
  }
};
document.addEventListener("click", e => {
  const pv = e.target.closest("[data-playview]");
  if (pv){ const info = viewInfo(pv.dataset.playview); playFrom(info.list, info.title, null, pv.dataset.playview); return; }
  const c = e.target.closest("[data-cmd]");
  if (c){ CMD[c.dataset.cmd]?.(e, c); return; }
  const v = e.target.closest("[data-view]");
  if (v){ toggleFs(false); go(v.dataset.view); return; }
  const set = e.target.closest("[data-set]");
  if (set){
    const k = set.dataset.set;
    if (k==="norm"){ cfg.norm = !cfg.norm; saveCfg(); routeNorm(); }
    if (k==="dyn"){ cfg.dyn = !cfg.dyn; saveCfg(); setDyn(cur()); }
    if (k==="startup") send({type:"setStartup", on:!S.host?.startup});
    if (k==="tray") send({type:"setTray", on:!S.host?.tray});
    render(); return;
  }
  const pr = e.target.closest("[data-preset]");
  if (pr){ cfg.eq = [...EQ_PRESETS[pr.dataset.preset]]; saveCfg(); eqNodes.forEach((b,i)=>b.gain.value = cfg.eq[i]); render(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab){ S.drawer = tab.dataset.tab; renderDrawer(); return; }
  const li = e.target.closest(".lyr p[data-li]");
  if (li){ const L = lyrics(cur()); if (L?.synced){ audio.currentTime = L.lines[li.dataset.li].t; if (audio.paused) toggle(); } }
});
$("#back").onclick = () => go(viewInfo().back);
$("#playAll").onclick = () => {
  const info = viewInfo(); if (!info.list?.length) return;
  if (S.ctxKey===S.view && S.currentId) return toggle();
  playFrom(info.list, info.title, S.shuffle ? info.list[Math.floor(Math.random()*info.list.length)].id : info.list[0].id);
};
$("#body").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const t = S.map.get(row.dataset.id), act = e.target.closest("[data-act]");
  if (act?.dataset.act==="like") return setLike(t);
  if (act?.dataset.act==="more"){ const r = act.getBoundingClientRect(); return trackMenu(t, r.left-200, r.bottom); }
  if (S.currentId===t.id) return toggle();
  const info = viewInfo(); playFrom(info.list, info.title, t.id);
});
$("#body").addEventListener("contextmenu", e => { const row = e.target.closest(".row"); if (!row) return; e.preventDefault(); trackMenu(S.map.get(row.dataset.id), e.clientX, e.clientY); });
document.addEventListener("contextmenu", e => { if (!e.target.closest("input")) e.preventDefault(); });
$("#dbody").addEventListener("click", e => {
  const x = e.target.closest("[data-qx]");
  if (x){ S.upNext.splice(+x.dataset.qx, 1); return renderDrawer(); }
  const q = e.target.closest(".qrow"); if (!q) return;
  const i = +q.dataset.i;
  if (q.dataset.q==="now") return toggle();
  if (q.dataset.q==="up"){ S.currentId = S.upNext.splice(i,1)[0]; load(); }
  else { S.idx = i; S.currentId = S.queue[i]; load(); }
});
document.addEventListener("mousedown", e => { if (!e.target.closest("#menu") && !e.target.closest("[data-cmd=sleep]")) closeMenu(); });
$("#main").addEventListener("scroll", closeMenu, {passive:true});

/* drag songs onto playlists, and reorder inside a playlist */
let dragId = null;
$("#body").addEventListener("dragstart", e => { const row = e.target.closest(".row"); if (!row) return; dragId = row.dataset.id; e.dataTransfer.setData("text/x-offbeat", dragId); e.dataTransfer.effectAllowed = "copyMove"; });
document.addEventListener("dragend", () => { dragId = null; $$(".drop-above,.drop-below,.dropok").forEach(x => x.classList.remove("drop-above","drop-below","dropok")); });
$("#side").addEventListener("dragover", e => { const n = e.target.closest("[data-pl]"); if (!n || !dragId) return; e.preventDefault(); $$(".dropok").forEach(x=>x.classList.remove("dropok")); n.classList.add("dropok"); });
$("#side").addEventListener("dragleave", e => { e.target.closest?.("[data-pl]")?.classList.remove("dropok"); });
$("#side").addEventListener("drop", e => { const n = e.target.closest("[data-pl]"); if (!n || !dragId) return; e.preventDefault(); n.classList.remove("dropok"); addToPlaylist(S.playlists.find(p=>p.id===n.dataset.pl), [dragId]); });
$("#body").addEventListener("dragover", e => {
  const row = e.target.closest(".row"), p = viewInfo().pl;
  if (!row || !dragId || !p || S.q) return;
  e.preventDefault();
  const below = e.offsetY > row.offsetHeight/2 || e.clientY > row.getBoundingClientRect().top + row.offsetHeight/2;
  $$(".drop-above,.drop-below").forEach(x => x.classList.remove("drop-above","drop-below"));
  row.classList.add(below ? "drop-below" : "drop-above");
});
$("#body").addEventListener("drop", e => {
  const row = e.target.closest(".row"), p = viewInfo().pl;
  if (!row || !dragId || !p) return;
  e.preventDefault();
  const below = row.classList.contains("drop-below"), ids = p.ids.filter(id => id !== dragId);
  let at = ids.indexOf(row.dataset.id); if (at < 0) return;
  ids.splice(below ? at+1 : at, 0, dragId); p.ids = ids; savePl(p); render();
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.classList.contains("js-seek")){
    seeking = true; const d = audio.duration || 0;
    $$(".js-seek").forEach(s => { s.value = el.value; s.style.setProperty("--p", el.value/10+"%"); });
    $$(".js-cur").forEach(c => c.textContent = fmt(el.value/1000*d));
  } else if (el === vol) setVol(+vol.value);
  else if (el.dataset.band !== undefined){
    const i = +el.dataset.band; cfg.eq[i] = +el.value; saveCfg();
    if (eqNodes[i]) eqNodes[i].gain.value = cfg.eq[i];
    el.style.setProperty("--p", (cfg.eq[i]+12)/24*100+"%");
    el.parentElement.querySelector(".bv").textContent = (cfg.eq[i]>0?"+":"") + cfg.eq[i] + " dB";
    $$(".chip.on").forEach(c => c.classList.remove("on"));
  } else if (el.dataset.xf !== undefined){
    cfg.xf = +el.value; saveCfg(); el.style.setProperty("--p", cfg.xf/12*100+"%"); $("#xfv").textContent = cfg.xf ? cfg.xf+" s" : "Off";
  }
});
document.addEventListener("change", e => {
  if (!e.target.classList.contains("js-seek")) return;
  if (audio.duration) audio.currentTime = e.target.value/1000*audio.duration;
  seeking = false;
});
$("#q").addEventListener("input", e => { S.q = e.target.value.trim(); render(); });
$("#sort").value = S.sort;
$("#sort").onchange = e => { S.sort = e.target.value; store.set("sort", S.sort); render(); };
$("#fileIn").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("#dirIn").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("#lrcIn").onchange = async e => {
  const f = e.target.files[0], t = cur(); e.target.value = "";
  if (!f || !t) return;
  t.lrc = await f.text(); lyrCache.delete(t.id); persist(t); renderDrawer(); renderFs(); toast("Lyrics added ✓");
};

addEventListener("keydown", e => {
  if (e.target.matches("input,select") && e.target.type !== "range"){ if (e.key==="Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  const keys = {
    " ":toggle, ArrowRight:()=> e.shiftKey ? next() : (audio.currentTime += 5), ArrowLeft:()=> e.shiftKey ? prev() : (audio.currentTime -= 5),
    ArrowUp:()=>setVol(Math.min(100,+vol.value+5)), ArrowDown:()=>setVol(Math.max(0,+vol.value-5)),
    "/":()=>$("#q").focus(), l:CMD.like, s:toggleShuffle, r:cycleRepeat, m:CMD.mute, q:CMD.queue, y:CMD.lyrics, f:CMD.fs, p:CMD.mini,
    Escape:()=>{ closeMenu(); $("#themeModal").classList.remove("on"); if ($("#fs").classList.contains("on")) toggleFs(false); }
  };
  if (keys[k]){ e.preventDefault(); keys[k](); }
});

let dragN = 0;
addEventListener("dragenter", e => { if (e.dataTransfer?.types.includes("Files")){ dragN++; $("#drop").classList.add("on"); } });
addEventListener("dragleave", e => { if (e.dataTransfer?.types.includes("Files") && --dragN <= 0){ dragN = 0; $("#drop").classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; $("#drop").classList.remove("on"); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
addEventListener("resize", () => { if (audio.paused) return; drawViz(); });

/* ---------- start ---------- */
(async () => {
  root.dataset.theme = S.theme || "midnight"; readViz();
  try {
    await openDB();
    ((await tx("meta","readonly",s=>s.getAll())) || []).forEach(hydrate);
    S.playlists = ((await tx("playlists","readonly",s=>s.getAll())) || []).sort((a,b)=>a.created-b.created);
    navigator.storage?.persist?.();
  } catch { toast("Couldn't open local storage — songs won't be saved"); }
  setVol(lastVol);
  renderSide(); render(); renderNow(); renderCtrls(); renderSleep();
  restoreSession();
  if (!S.theme){ S.theme = "midnight"; openThemes(); } else applyTheme(S.theme);
  send({type:"ready"});
})();
</script>
</body>
</html>
