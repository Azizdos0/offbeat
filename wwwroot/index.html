<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Safety: this app can never talk to the internet. It can only read its own page and your music folder. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'self'; form-action 'none'">
<title>Offbeat</title>
<style>
/* colours taken from the playing song's cover animate smoothly */
@property --dh{syntax:"<number>";inherits:true;initial-value:150}
@property --ds{syntax:"<percentage>";inherits:true;initial-value:60%}

/* ============ THEMES ============ */
[data-theme="midnight"]{
  --bg:#000;--panel:#121212;--panel2:#1f1f1f;--hover:#ffffff12;--text:#fff;--muted:#a7a7a7;
  --accent:#1ed760;--accent2:#1db9a0;--ink:#000;--line:#ffffff14;--radius:10px;--gap:8px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--head:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --hw:800;--hcase:none;--hls:-.02em;--dh:145;--ds:58%;--fsl:24%;--minil:18%;
  --hero:linear-gradient(180deg,hsl(var(--dh) var(--ds) 30%) 0%,#121212 92%);--player:#000;--btnr:999px;--border:none;--shadow:none;--glow:none;
}
[data-theme="neon"]{
  --bg:#07020f;--panel:#10061fcc;--panel2:#1d0d3a;--hover:#ff2bd61f;--text:#f6ecff;--muted:#a08cc8;
  --accent:#ff2bd6;--accent2:#00f0ff;--ink:#07020f;--line:#ff2bd640;--radius:3px;--gap:12px;
  --font:"Segoe UI",system-ui,sans-serif;--head:"Cascadia Code","Consolas",ui-monospace,monospace;
  --hw:700;--hcase:uppercase;--hls:.08em;--dh:290;--ds:80%;--fsl:20%;--minil:14%;
  --hero:linear-gradient(180deg,hsl(var(--dh) 85% 24% / .85),#10061f00);--player:#0c0418ee;--btnr:3px;
  --border:1px solid #ff2bd655;--shadow:0 0 24px #ff2bd622, inset 0 0 24px #00f0ff0d;--glow:0 0 10px #ff2bd6,0 0 26px #ff2bd677;
}
[data-theme="glass"]{
  --bg:#0a0d1f;--panel:#ffffff12;--panel2:#ffffff1c;--hover:#ffffff17;--text:#fff;--muted:#c3c7e8b0;
  --accent:#b69cff;--accent2:#6ee7ff;--ink:#120b2e;--line:#ffffff1f;--radius:22px;--gap:14px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--head:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --hw:600;--hcase:none;--hls:-.01em;--dh:265;--ds:70%;--fsl:24%;--minil:18%;
  --hero:transparent;--player:#ffffff14;--btnr:999px;--border:1px solid #ffffff26;--shadow:0 10px 40px #0005;--glow:none;
}
[data-theme="paper"]{
  --bg:#f3efe6;--panel:#f3efe6;--panel2:#e9e4d8;--hover:#1a181514;--text:#1a1815;--muted:#6f695f;
  --accent:#e4572e;--accent2:#2e6fe4;--ink:#fff;--line:#1a181522;--radius:0px;--gap:0px;
  --font:"Segoe UI",system-ui,sans-serif;--head:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --hw:500;--hcase:none;--hls:-.01em;--dh:38;--ds:40%;--fsl:86%;--minil:88%;
  --hero:hsl(var(--dh) calc(var(--ds) * .6) 89%);--player:#f3efe6;--btnr:0;--border:none;--shadow:none;--glow:none;
}
[data-theme="vinyl"]{
  --bg:#150e0a;--panel:#231812;--panel2:#33241b;--hover:#f2a5411a;--text:#f7e8d4;--muted:#b49b81;
  --accent:#f2a541;--accent2:#e2553f;--ink:#1c120c;--line:#f7e8d41a;--radius:16px;--gap:10px;
  --font:"Segoe UI",system-ui,sans-serif;--head:"Rockwell","Georgia",serif;
  --hw:700;--hcase:none;--hls:0;--dh:22;--ds:48%;--fsl:22%;--minil:16%;
  --hero:radial-gradient(120% 90% at 20% 0%,hsl(var(--dh) var(--ds) 26%) 0%,#231812 70%);--player:#1c130e;--btnr:999px;
  --border:1px solid #f7e8d412;--shadow:0 8px 30px #0006;--glow:none;
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{transition:--dh 1.4s ease,--ds 1.4s ease}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit;cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
svg{width:20px;height:20px;fill:currentColor;flex:none}
h1,h2,h3,.head{font-family:var(--head);font-weight:var(--hw);text-transform:var(--hcase);letter-spacing:var(--hls)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

#app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100vh;gap:var(--gap);padding:var(--gap);position:relative;z-index:1}
#app.drawer-on{grid-template-columns:250px minmax(0,1fr) 340px}
.panel{background:var(--panel);border-radius:var(--radius);border:var(--border);box-shadow:var(--shadow)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:2px;padding:18px 12px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-size:22px}
.logo .mark{width:30px;height:30px;border-radius:calc(var(--radius) + 2px);background:var(--accent);color:var(--ink);display:grid;place-items:center;box-shadow:var(--glow)}
.logo .mark svg{width:18px;height:18px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:calc(var(--radius) * .7);color:var(--muted);font-weight:600;width:100%;text-align:left;transition:.15s;min-height:38px}
.nav span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{color:var(--text);background:var(--hover)}
.nav.on{color:var(--text);background:var(--panel2)}
.nav.on svg{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;opacity:.7;font-weight:500}
.nav.dropok{outline:2px dashed var(--accent);outline-offset:-2px}
.shead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.shead .ib{width:26px;height:26px}
.sep{height:1px;background:var(--line);margin:10px 6px}
.small{font-size:12px;color:var(--muted);padding:0 12px}
.side .grow{flex:1;min-height:12px}

/* main */
main{overflow:auto;position:relative;min-width:0}
.hero{background:var(--hero);padding:28px;display:flex;gap:28px;align-items:flex-end;border-radius:var(--radius) var(--radius) 0 0;min-height:290px;position:relative;overflow:hidden}
main.nohero .hero{display:none}
.np-visual{width:220px;height:220px;flex:none;position:relative}
.np-cover{width:100%;height:100%;border-radius:calc(var(--radius) * .8);box-shadow:0 12px 40px #0008;font-size:80px}
.disc{display:none}
.np-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;z-index:1}
.np-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.np-label span{color:var(--muted)}
.np-title{font-size:clamp(28px,4.5vw,64px);line-height:1.02;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.np-artist{color:var(--muted);font-size:16px;font-weight:600}
canvas.viz{width:100%;height:64px;display:block}
.hero canvas.viz{margin-top:10px}

.toolbar{display:flex;align-items:center;gap:12px;padding:18px 28px;position:sticky;top:0;z-index:5;background:var(--panel);backdrop-filter:blur(20px);flex-wrap:wrap}
.bigplay{width:54px;height:54px;border-radius:var(--btnr);background:var(--accent);color:var(--ink);display:grid;place-items:center;transition:transform .15s;box-shadow:var(--glow);flex:none}
.bigplay:hover{transform:scale(1.06)}
.bigplay svg{width:24px;height:24px}
.vt{margin-right:auto;min-width:0}
.vt h2{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt div{color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:var(--btnr);padding:0 14px;height:40px;border:var(--border)}
.search input{background:none;border:0;outline:0;width:190px;user-select:text}
.search svg{width:16px;height:16px;color:var(--muted)}
select{background:var(--panel2);border:var(--border);border-radius:var(--btnr);height:40px;padding:0 12px;outline:0}
select option{background:var(--panel2);color:var(--text)}
[hidden]{display:none!important}

.list{padding:0 16px 24px}
.row,.lhead{display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) 40px 56px 36px;align-items:center;gap:12px;padding:6px 12px;border-radius:calc(var(--radius) * .6)}
.lhead{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:8px;padding-bottom:10px}
.row{cursor:pointer;transition:background .12s;position:relative}
.row:hover{background:var(--hover)}
.row.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.row.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
.row .c-n{color:var(--muted);text-align:center;display:grid;place-items:center}
.row .pl,.row .eq{display:none}
.row:hover .n{display:none}.row:hover .pl{display:block;width:16px}
.row.on .n,.row.on:hover .pl{display:none}.row.on .eq{display:flex}
.row.on .tt{color:var(--accent)}
.c-t{display:flex;gap:12px;align-items:center;min-width:0}
.c-t>div{min-width:0}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ta,.c-al{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.c-d{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--btnr);color:var(--muted);transition:.15s;position:relative;flex:none}
.ib:hover{color:var(--text);background:var(--hover)}
.ib.on{color:var(--accent)}
.ib svg{width:18px;height:18px}
.row .more{opacity:0}.row:hover .more{opacity:1}
.like.on{color:var(--accent)}
.row .like:not(.on){opacity:0}.row:hover .like{opacity:1}
.badge{position:absolute;top:-2px;right:-4px;font-size:9px;font-weight:800;background:var(--accent);color:var(--ink);border-radius:8px;padding:1px 4px;line-height:1.2}
.badge:empty{display:none}

.eq{gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
html:not(.playing) .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

.art{width:44px;height:44px;border-radius:calc(var(--radius) * .4);background:var(--panel2) center/cover;flex:none;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:18px;color:#ffffffd0;overflow:hidden}
.art.gen{background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 70) 70% 32%))}
.art.big{width:100%;height:100%}

/* album / artist grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:4px 18px 28px}
.card{padding:12px;border-radius:calc(var(--radius) * .8);cursor:pointer;transition:background .15s;min-width:0}
.card:hover{background:var(--hover)}
.cwrap{aspect-ratio:1;position:relative}
.cwrap .art{font-size:54px;border-radius:calc(var(--radius) * .6);box-shadow:0 8px 24px #0005}
.card.round .cwrap .art{border-radius:50%}
.cplay{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:var(--btnr);background:var(--accent);color:var(--ink);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 18px #0007}
.card:hover .cplay{opacity:1;transform:none}
.cn{font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text);font-size:22px;margin-bottom:8px}
.empty.sm{padding:40px 14px}.empty.sm h3{font-size:18px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:var(--btnr);background:var(--accent);color:var(--ink);font-weight:700;transition:transform .15s;box-shadow:var(--glow);white-space:nowrap}
.btn:hover{transform:scale(1.04)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:#e5484d;color:#fff;box-shadow:none}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* settings + stats pages */
.page{padding:30px 32px 40px;max-width:900px}
.page>h1{font-size:40px;margin-bottom:24px}
.sec{margin-bottom:34px}
.sec>h3{font-size:20px;margin-bottom:6px}
.setrow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow .sl{flex:1;min-width:220px}
.setrow .sl b{display:block;font-weight:600}
.setrow .sl span{color:var(--muted);font-size:13px;word-break:break-all}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:.2s}
.sw.on{background:var(--accent);border-color:transparent}.sw.on::after{left:23px;background:var(--ink)}
.eqbox{display:flex;gap:22px;align-items:flex-end;padding:18px 4px 6px;flex-wrap:wrap}
.band{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.chip{padding:6px 14px;border-radius:var(--btnr);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);color:var(--ink);border-color:transparent}
.xf{display:flex;align-items:center;gap:12px;min-width:240px}
.xf b{width:48px;text-align:right;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px;padding-top:10px;font-size:13px;color:var(--muted)}
kbd{font:600 12px var(--font);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--text);margin-right:6px}

.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.scard{background:var(--panel2);border-radius:var(--radius);padding:18px;border:var(--border)}
.scard b{font:var(--hw) 34px/1.1 var(--head);display:block;color:var(--accent)}
.scard span{color:var(--muted);font-size:13px}
.topsong{display:flex;gap:24px;align-items:center;padding:22px;border-radius:var(--radius);background:linear-gradient(120deg,hsl(var(--dh) var(--ds) var(--fsl)),var(--panel2));margin-bottom:26px;border:var(--border)}
.topsong .art{width:120px;height:120px;font-size:44px;box-shadow:0 10px 30px #0006}
.topsong small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.topsong h2{font-size:34px;line-height:1.1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rank{display:flex;align-items:center;gap:12px;padding:7px 6px;border-radius:8px}
.rank i{font-style:normal;width:20px;color:var(--muted);font-weight:700;text-align:center}
.rank>div{min-width:0;flex:1}
.rank .v{color:var(--muted);font-size:12px;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:12px}
.chart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;opacity:.85;transition:opacity .15s}
.chart div:hover{opacity:1}
.chart-l{display:flex;gap:6px;font-size:10px;color:var(--muted);margin-top:6px}
.chart-l span{flex:1;text-align:center}

/* queue + lyrics drawer */
.drawer{display:none;flex-direction:column;overflow:hidden;min-width:0}
#app.drawer-on .drawer{display:flex}
.dtabs{display:flex;gap:6px;padding:14px 12px 8px;align-items:center}
.dtab{padding:6px 14px;border-radius:var(--btnr);font-weight:600;color:var(--muted)}
.dtab:hover{color:var(--text)}
.dtab.on{background:var(--text);color:var(--bg)}
.dtabs .ib{margin-left:auto}
.dbody{flex:1;overflow:auto;padding:4px 10px 16px;position:relative}
.qh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:14px 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.qh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.lnk:hover{color:var(--text)}
.qrow{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:calc(var(--radius) * .5);cursor:pointer}
.qrow:hover{background:var(--hover)}
.qrow .art{width:40px;height:40px;font-size:15px}
.qrow>div:not(.art){min-width:0;flex:1}
.qrow.on .tt{color:var(--accent)}
.qrow .ib{width:28px;height:28px;opacity:0}.qrow:hover .ib{opacity:1}
.lyr{padding:18px 8px 45vh;font-family:var(--head);font-weight:700;font-size:22px;line-height:1.35;letter-spacing:0;text-transform:none}
.lyr p{color:var(--text);opacity:.38;margin:0 0 14px;cursor:pointer;transition:opacity .3s,transform .3s;transform-origin:left center}
.lyr p:hover{opacity:.7}
.lyr p.on{opacity:1;transform:scale(1.03)}
.lyr.plain p{opacity:.9;cursor:default;font-size:17px;font-weight:500;margin-bottom:6px;transform:none}

/* player */
.player{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:10px 16px;background:var(--player);min-height:84px;position:relative}
.p-now{display:flex;gap:12px;align-items:center;min-width:0}
.p-now .art{width:56px;height:56px}
.p-now .meta{min-width:0}
.p-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctrls{display:flex;align-items:center;gap:14px}
.ctrls .ib .one{position:absolute;font-size:9px;font-weight:800;top:4px;right:5px;color:var(--accent)}
.pp{width:40px;height:40px;border-radius:var(--btnr);background:var(--text);color:var(--bg);display:grid;place-items:center;transition:transform .12s;flex:none}
[data-theme="neon"] .pp{background:var(--accent);color:var(--ink);box-shadow:var(--glow)}
.pp:hover{transform:scale(1.07)}
.seek{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek span{width:38px;text-align:center}
.p-right{display:flex;justify-content:flex-end;align-items:center;gap:2px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--text) var(--p,0%),var(--line) var(--p,0%));outline:0;cursor:pointer}
input[type=range]:hover{background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
#vol{width:96px;flex:none;margin-left:2px}
.band input[type=range],.band input[type=range]:hover{writing-mode:vertical-lr;direction:rtl;width:6px;height:140px;flex:none;background:linear-gradient(to top,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
.band input[type=range]::-webkit-slider-thumb{opacity:1;width:16px;height:16px}
.xf input[type=range]::-webkit-slider-thumb{opacity:1}
.mini-only{display:none!important}

/* full-screen now playing */
.fs{position:fixed;inset:0;z-index:30;display:none;background:var(--bg);color:var(--text);overflow:hidden}
.fs.on{display:flex;flex-direction:column}
.fs-bg{position:absolute;inset:0;background:radial-gradient(90% 90% at 25% 30%,hsl(var(--dh) var(--ds) var(--fsl)) 0%,var(--bg) 85%)}
.fs-img{position:absolute;inset:-15%;background:center/cover;filter:blur(80px) saturate(150%);opacity:.3}
.fs-x{position:absolute;top:16px;right:18px;z-index:3}
.fs-main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6vw;padding:6vh 6vw 0;min-height:0}
.fs-art{width:min(52vh,42vw);aspect-ratio:1;flex:none}
.fs .np-visual{width:100%;height:100%}
.fs .np-cover{font-size:140px}
.fs-lyr{flex:1;max-width:640px;height:100%;overflow:auto;position:relative;mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);scrollbar-width:none}
.fs-lyr::-webkit-scrollbar{display:none}
.fs-lyr .lyr{font-size:clamp(24px,2.6vw,38px);padding-top:30vh}
.fs.nolyr .fs-lyr{display:none}
.fs-foot{position:relative;padding:2vh 6vw 3vh;display:flex;flex-direction:column;gap:8px}
.fs-meta{display:flex;align-items:flex-end;gap:14px}
.fs-meta>div{flex:1;min-width:0}
.fs-title{font-size:clamp(28px,4vw,54px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-artist{color:var(--muted);font-size:18px;font-weight:600}
.fs canvas.viz{height:70px;opacity:.9}
.fs .ctrls{justify-content:center}
.fs .pp{width:62px;height:62px}.fs .pp svg{width:28px;height:28px}

/* overlays */
.drop{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#000a;backdrop-filter:blur(6px)}
.drop.on{display:grid}
.drop div{border:3px dashed var(--accent);border-radius:24px;padding:60px 80px;font-size:24px;font-family:var(--head);color:#fff;text-align:center}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:90;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.menu{position:fixed;z-index:70;min-width:230px;max-width:300px;max-height:70vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:calc(var(--radius) * .5 + 4px);padding:6px;box-shadow:0 16px 50px #0009;display:none;backdrop-filter:blur(30px)}
.menu.on{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:6px;text-align:left;font-size:13px}
.menu button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button:hover{background:var(--hover)}
.menu .danger{color:#ff6b6b}
.menu svg{width:16px;height:16px;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.msep+.msep,.msep:last-child{display:none}
.mhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 10px 4px}
.dlg{position:fixed;inset:0;z-index:80;background:#0009;display:none;place-items:center;backdrop-filter:blur(4px)}
.dlg.on{display:grid}
.dlg-in{background:var(--panel2);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);padding:24px;width:min(430px,92vw);box-shadow:0 20px 60px #000a}
.dlg-in h3{font-size:22px;margin-bottom:8px}
.dlg-in p{color:var(--muted)}
.dlg-in input{width:100%;margin-top:14px;height:44px;padding:0 14px;border-radius:calc(var(--radius) * .5 + 2px);border:1px solid var(--line);background:var(--bg);outline:0;user-select:text}
.dlg-in input:focus{border-color:var(--accent)}
.dlg-in .btns{justify-content:flex-end}
[data-theme="glass"] .menu,[data-theme="glass"] .dlg-in{background:#1b1840f2}
[data-theme="neon"] .menu,[data-theme="neon"] .dlg-in{background:#160a2cf5}

.modal{position:fixed;inset:0;z-index:40;background:#000c;backdrop-filter:blur(10px);display:none;overflow:auto;padding:40px 20px}
.modal.on{display:block}
.modal-in{max-width:1180px;margin:0 auto;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
.modal h1{font:800 36px/1.1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;text-align:center}
.modal p.sub{text-align:center;color:#aaa;margin:8px 0 30px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tcard{border-radius:16px;overflow:hidden;text-align:left;background:#ffffff0d;border:2px solid #ffffff14;transition:.2s;color:#fff}
.tcard:hover{transform:translateY(-4px);border-color:#ffffff55}
.tcard.cur{border-color:#fff}
.tcard .tname{padding:12px 14px 2px;font-weight:800;font-size:16px}
.tcard .tdesc{padding:0 14px 14px;font-size:12px;color:#aaa}
.tprev{height:200px;background:var(--bg);display:grid;grid-template-columns:52px 1fr;grid-template-rows:1fr 34px;gap:var(--gap);padding:var(--gap);font-family:var(--font);color:var(--text);position:relative;overflow:hidden}
.tprev>*{background:var(--panel);border-radius:calc(var(--radius) * .5);border:var(--border);position:relative;z-index:1}
.tprev .ms{display:flex;flex-direction:column;gap:6px;padding:8px 6px}
.tprev .ms i{height:6px;border-radius:3px;background:var(--line)}.tprev .ms i:first-child{background:var(--accent);width:60%;box-shadow:var(--glow)}
.tprev .mm{background:var(--hero),var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px}
.tprev .mm b{font:var(--hw) 17px/1 var(--head);text-transform:var(--hcase);letter-spacing:var(--hls)}
.tprev .mm .c{width:54px;height:54px;border-radius:calc(var(--radius) * .5);background:linear-gradient(135deg,var(--accent),var(--accent2))}
[data-theme="vinyl"] .tprev .mm .c{border-radius:50%;background:radial-gradient(circle,var(--accent) 0 26%,#111 27% 30%,#222 31% 100%)}
.tprev .mm i{height:5px;border-radius:3px;background:var(--line);width:80%}
.tprev .mp{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px}
.tprev .mp span{width:16px;height:16px;border-radius:var(--btnr);background:var(--accent);box-shadow:var(--glow)}
.tprev .mp i{width:50%;height:3px;background:linear-gradient(90deg,var(--accent) 40%,var(--line) 40%);border-radius:3px}
.close{position:fixed;top:16px;right:20px;color:#fff;font-size:28px;width:44px;height:44px;border-radius:50%;background:#ffffff14}

/* ============ THEME-SPECIFIC FLAIR ============ */
/* NEON */
[data-theme="neon"] body::before{content:"";position:fixed;left:-50%;right:-50%;bottom:-10%;height:60%;background-image:linear-gradient(#ff2bd655 1px,transparent 1px),linear-gradient(90deg,#00f0ff44 1px,transparent 1px);background-size:48px 48px;transform:perspective(400px) rotateX(62deg);transform-origin:bottom;animation:grid 3s linear infinite;mask-image:linear-gradient(transparent,#000 70%)}
[data-theme="neon"] body::after{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 100%,hsl(var(--dh) 90% 55% / .2),transparent),radial-gradient(40% 30% at 80% 0%,#00f0ff22,transparent);pointer-events:none}
@keyframes grid{to{background-position:0 48px}}
[data-theme="neon"] .panel{backdrop-filter:blur(8px)}
[data-theme="neon"] .np-title,[data-theme="neon"] .fs-title{text-shadow:0 0 18px #ff2bd6aa;color:#fff}
[data-theme="neon"] .np-label{color:var(--accent2);text-shadow:0 0 8px var(--accent2)}
[data-theme="neon"] .np-cover{box-shadow:0 0 0 2px var(--accent),0 0 40px #ff2bd6aa}
[data-theme="neon"] .row.on{background:linear-gradient(90deg,#ff2bd626,transparent)}
[data-theme="neon"] .row.on .tt{text-shadow:0 0 8px var(--accent)}
[data-theme="neon"] input[type=range]{background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%));box-shadow:0 0 8px #ff2bd666}
[data-theme="neon"] .lyr p.on{text-shadow:0 0 14px var(--accent)}

/* GLASS: aurora blobs tinted by the playing song */
[data-theme="glass"] body::before,[data-theme="glass"] body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.55;animation:float 22s ease-in-out infinite alternate}
[data-theme="glass"] body::before{background:hsl(var(--dh) 80% 52%);top:-20vmax;left:-10vmax}
[data-theme="glass"] body::after{background:hsl(calc(var(--dh) - 75) 85% 45%);bottom:-25vmax;right:-15vmax;animation-duration:28s;animation-direction:alternate-reverse}
[data-theme="glass"] #app::before{content:"";position:fixed;width:40vmax;height:40vmax;border-radius:50%;background:hsl(calc(var(--dh) + 65) 80% 58%);filter:blur(100px);opacity:.35;top:30%;left:40%;z-index:-1;animation:float 18s ease-in-out infinite alternate-reverse}
@keyframes float{to{transform:translate(12vmax,8vmax) scale(1.15)}}
[data-theme="glass"] .panel{backdrop-filter:blur(28px) saturate(160%)}
[data-theme="glass"] .toolbar{background:transparent}
[data-theme="glass"] .pp{background:#fff;color:#120b2e}

/* PAPER */
[data-theme="paper"] .side{border-right:1px solid var(--line)}
[data-theme="paper"] .drawer{border-left:1px solid var(--line)}
[data-theme="paper"] .player{border-top:1px solid var(--text)}
[data-theme="paper"] .hero{border-bottom:1px solid var(--line);align-items:center}
[data-theme="paper"] .np-title,[data-theme="paper"] .fs-title{font-style:italic;font-weight:400}
[data-theme="paper"] .np-cover{box-shadow:10px 10px 0 var(--text);border:1px solid var(--text)}
[data-theme="paper"] .logo .mark{border-radius:50%}
[data-theme="paper"] .nav.on{background:none;color:var(--accent);text-decoration:underline;text-underline-offset:5px}
[data-theme="paper"] .row{border-radius:0;border-bottom:1px solid var(--line)}
[data-theme="paper"] .row:hover{background:var(--panel2)}
[data-theme="paper"] .art{color:#fff}
[data-theme="paper"] .art.gen{background:hsl(var(--h) 55% 55%)}
[data-theme="paper"] .tt{font-family:var(--head);font-size:17px;font-weight:500}
[data-theme="paper"] .toolbar{border-bottom:1px solid var(--line)}
[data-theme="paper"] .toast{border-radius:0}
[data-theme="paper"] .lyr{font-style:italic;font-weight:500}

/* VINYL */
[data-theme="vinyl"] .np-cover{display:none}
[data-theme="vinyl"] .disc{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);box-shadow:0 14px 40px #000a,inset 0 0 0 6px #0b0b0b;animation:spin 3.2s linear infinite;animation-play-state:paused;position:relative}
[data-theme="vinyl"] .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 12%,#ffffff18 16%,transparent 22% 60%,#ffffff10 66%,transparent 72%)}
html.playing[data-theme="vinyl"] .disc{animation-play-state:running}
[data-theme="vinyl"] .disc .label{width:40%;height:40%;border-radius:50%;overflow:hidden;position:relative}
[data-theme="vinyl"] .disc .label .art{width:100%;height:100%;border-radius:50%;font-size:28px}
[data-theme="vinyl"] .disc .label::after{content:"";position:absolute;width:10%;height:10%;border-radius:50%;background:var(--bg);top:45%;left:45%}
@keyframes spin{to{transform:rotate(360deg)}}
[data-theme="vinyl"] .hero .np-visual{width:240px;height:240px}
[data-theme="vinyl"] .p-now .art{border-radius:50%;animation:spin 3.2s linear infinite;animation-play-state:paused}
html.playing[data-theme="vinyl"] .p-now .art{animation-play-state:running}
[data-theme="vinyl"] .np-title{color:#fff1de}

/* ============ MINI PLAYER (window shrinks, stays on top) ============ */
html.mini .side,html.mini main,html.mini .drawer{display:none!important}
html.mini #app{grid-template-columns:1fr!important;grid-template-rows:1fr;padding:0;gap:0}
html.mini .player{display:flex;flex-direction:column;justify-content:center;gap:8px;border-radius:0;border:0;padding:12px 16px;background:linear-gradient(135deg,hsl(var(--dh) var(--ds) var(--minil)),var(--bg) 90%)}
html.mini .p-now{padding-right:44px}
html.mini .p-now .art{width:62px;height:62px}
html.mini .p-right{position:absolute;top:8px;right:8px}
html.mini .p-right>*:not(.mini-only){display:none}
html.mini .mini-only{display:grid!important}
html.mini .ctrls{gap:10px}
html.mini .seek{font-size:10px}

/* ============ SMALL WINDOWS ============ */
@media (max-width:1100px){
  #vol{display:none}
  #app.drawer-on{grid-template-columns:250px minmax(0,1fr)}
  .drawer{position:fixed;right:calc(var(--gap) + 8px);top:calc(var(--gap) + 8px);bottom:104px;width:min(340px,92vw);z-index:20;box-shadow:0 20px 60px #000a}
  [data-theme="glass"] .drawer{background:#1b1840f2}
}
@media (max-width:820px){
  #app,#app.drawer-on{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  .side{flex-direction:row;padding:8px;overflow-x:auto;align-items:center;gap:4px}
  .side .logo{padding:0 8px 0 4px;font-size:0}
  .side .sep,.side .small,.side .grow,.side .shead,.nav .cnt,.side .pl-nav{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  .drawer{position:fixed;right:8px;top:8px;bottom:100px;width:min(340px,92vw);z-index:20}
  .hero{flex-direction:column;align-items:flex-start;padding:20px;min-height:0}
  .np-visual,[data-theme="vinyl"] .hero .np-visual{width:150px;height:150px}
  .toolbar{padding:12px 16px}
  .search input{width:120px}
  .list{padding:0 4px 20px}
  .row,.lhead{grid-template-columns:28px minmax(0,1fr) 36px 46px}
  .c-al,.row .more{display:none}
  .player{grid-template-columns:1fr auto;gap:8px}
  .p-mid{grid-column:1/-1;grid-row:1}
  .cols{grid-template-columns:1fr}
  .fs-main{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const root = document.documentElement;
const THEMES = [
  {id:"midnight",name:"Midnight",desc:"Sleek, dark & green — the classic streaming look."},
  {id:"neon",name:"Neon",desc:"Synthwave glow with a moving retro grid."},
  {id:"glass",name:"Glass",desc:"Frosted panels floating over aurora lights."},
  {id:"paper",name:"Paper",desc:"Light, calm, editorial — like a magazine."},
  {id:"vinyl",name:"Vinyl",desc:"Warm retro vibes with a spinning record."}
];
const VIZ = {midnight:"bars",neon:"mirror",glass:"wave",paper:"lines",vinyl:"wave"};
const EQ_BANDS = [60,250,1000,4000,12000], EQ_LABELS = ["60","250","1k","4k","12k"];
const EQ_PRESETS = {"Flat":[0,0,0,0,0],"Bass boost":[7,4,0,0,0],"Vocal":[-2,-1,3,4,1],"Lo-fi":[3,1,0,-5,-10],"Treble":[0,0,0,3,6],"Rock":[4,2,-1,2,4],"Electronic":[5,3,0,1,4],"Acoustic":[2,1,1,2,2]};

const store = {
  get(k,d){try{const v=localStorage.getItem("offbeat."+k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem("offbeat."+k,JSON.stringify(v))}catch{}}
};
const cfg = Object.assign({eq:[0,0,0,0,0], xf:0, norm:false, dyn:true}, store.get("cfg",{}));
const saveCfg = () => store.set("cfg", cfg);
const stats = Object.assign({total:0, days:{}, since:Date.now()}, store.get("stats",{}));
const S = {tracks:[], map:new Map(), playlists:[], view:"all", q:"", sort:store.get("sort","added"),
  ctx:[], queue:[], idx:-1, currentId:null, upNext:[], ctxLabel:"", ctxKey:"",
  shuffle:store.get("shuffle",false), repeat:store.get("repeat",0), theme:store.get("theme",null),
  drawer:null, sleep:null, host:null, hidden:store.get("hiddenPaths",[])};
const host = window.chrome?.webview || null; // the desktop shell (absent in a plain browser)
const send = m => { try { host?.postMessage(m); } catch {} };

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const fmtLong = s => { s = Math.round(s||0); const h = Math.floor(s/3600), m = Math.round(s%3600/60); return h ? `${h} h ${m} min` : `${m} min`; };
const hash = s => { let h=0; for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,10);
const icon = id => `<svg><use href="#i-${id}"/></svg>`;
const wait = ms => new Promise(r => setTimeout(r, ms));
const baseName = p => p.split(/[\\/]/).pop();
const stripExt = p => p.replace(/\.[^.\\/]+$/, "");
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const cmp = (a,b) => a.localeCompare(b, undefined, {sensitivity:"base", numeric:true});
const today = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function shuffleArr(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function art(t, cls="") {
  if (!t) return `<div class="art gen ${cls}" style="--h:150">♪</div>`;
  if (t.coverUrl) return `<div class="art ${cls}" style="background-image:url('${t.coverUrl}')"></div>`;
  return `<div class="art gen ${cls}" style="--h:${hash(t.artist+t.title)%360}">${esc((t.title.trim()[0]||"♪").toUpperCase())}</div>`;
}
const visual = t => `<div class="np-visual"><div class="np-cover">${art(t,"big")}</div><div class="disc"><div class="label">${art(t,"big")}</div></div></div>`;
let toastT;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2400); }

/* ---------- local database (IndexedDB, stays on this computer) ---------- */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("offbeat", 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"id"});
      if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
      if (!d.objectStoreNames.contains("playlists")) d.createObjectStore("playlists",{keyPath:"id"});
    };
    r.onsuccess = () => res(db = r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(name, mode, fn){
  return new Promise((res,rej)=>{
    const t = db.transaction(name, mode), req = fn(t.objectStore(name));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
function persist(t){ const {coverUrl, ...m} = t; return tx("meta","readwrite",s=>s.put(m)).catch(()=>{}); }
const dirty = new Set();
function flushDirty(){ for (const id of dirty){ const t=S.map.get(id); if (t) persist(t); } dirty.clear(); }
const savePl = p => tx("playlists","readwrite",s=>s.put(p)).catch(()=>{});
function hydrate(t){ t.coverUrl = t.cover ? URL.createObjectURL(t.cover) : null; t.listened ||= 0; t.plays ||= 0; S.tracks.push(t); S.map.set(t.id, t); }

/* ---------- read song info (ID3 tags, cover art, lyrics) ---------- */
function decode(enc, b){
  if (enc===1) return new TextDecoder(b[0]===0xFE&&b[1]===0xFF?"utf-16be":"utf-16le").decode(b);
  if (enc===2) return new TextDecoder("utf-16be").decode(b);
  return new TextDecoder(enc===3?"utf-8":"latin1").decode(b);
}
const txt = d => decode(d[0], d.subarray(1)).replace(/\0/g,"").replace(/^﻿/,"").trim();
function skipText(d, i, enc){
  if (enc===1||enc===2){ while (i+1<d.length && !(d[i]===0&&d[i+1]===0)) i+=2; return i+2; }
  while (i<d.length && d[i]!==0) i++; return i+1;
}
async function readTags(file){
  const h = new Uint8Array(await file.slice(0,10).arrayBuffer());
  if (h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3) return {};
  const ver = h[3], ss = (b,i)=>(b[i]<<21)|(b[i+1]<<14)|(b[i+2]<<7)|b[i+3], be = (b,i)=>((b[i]<<24)|(b[i+1]<<16)|(b[i+2]<<8)|b[i+3])>>>0;
  const size = ss(h,6), buf = new Uint8Array(await file.slice(10,10+size).arrayBuffer()), out = {};
  let p = (h[5]&0x40) ? (ver===4 ? ss(buf,0) : be(buf,0)+4) : 0;
  while (p+10 < buf.length){
    const id = String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const sz = ver===4 ? ss(buf,p+4) : be(buf,p+4);
    const d = buf.subarray(p+10, p+10+sz); p += 10+sz;
    if (!sz) continue;
    if (id==="TIT2") out.title = txt(d);
    else if (id==="TPE1") out.artist = txt(d);
    else if (id==="TALB") out.album = txt(d);
    else if (id==="TRCK") out.no = parseInt(txt(d)) || 0;
    else if (id==="USLT" && !out.lyrics){ const i = skipText(d, 4, d[0]); out.lyrics = decode(d[0], d.subarray(i)).replace(/\0/g,"").trim(); }
    else if (id==="APIC" && !out.cover){
      const enc = d[0]; let i = 1;
      while (i<d.length && d[i]!==0) i++;
      let mime = new TextDecoder("latin1").decode(d.subarray(1,i)) || "image/jpeg";
      if (!mime.includes("/")) mime = "image/"+mime.toLowerCase();
      i = skipText(d, i+2, enc);
      if (i < d.length) out.cover = new Blob([d.slice(i)], {type:mime});
    }
  }
  return out;
}
function getDuration(blob){
  return new Promise(r=>{
    const a = new Audio(), u = URL.createObjectURL(blob);
    const done = v => { r(v); URL.revokeObjectURL(u); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(isFinite(a.duration)?a.duration:0);
    a.onerror = () => done(-1);
    a.src = u;
  });
}

/* ---------- adding music ---------- */
const AUDIO_RE = /\.(mp3|m4a|aac|flac|wav|ogg|oga|opus|weba|webm)$/i, LRC_RE = /\.lrc$/i;
let addSeq = 0;
async function importOne(blob, name, extra={}){
  const dur = await getDuration(blob);
  if (dur < 0) return null; // this format can't be played
  const tags = await readTags(blob).catch(()=>({}));
  const base = stripExt(name).replace(/_/g," ");
  const m = base.match(/^(.+?)\s+-\s+(.+)$/);
  const meta = {id:uid(), name, size:extra.size ?? blob.size, path:extra.path || null,
    title:tags.title||(m?m[2]:base), artist:tags.artist||(m?m[1]:"Unknown artist"), album:tags.album||"", no:tags.no||0,
    duration:dur, added:Date.now()+(addSeq++), liked:false, plays:0, listened:0, cover:tags.cover||null, lrc:extra.lrc||tags.lyrics||null};
  if (!meta.path) await tx("blobs","readwrite",s=>s.put(blob, meta.id));
  await tx("meta","readwrite",s=>s.put(meta));
  hydrate(meta);
  return meta;
}
async function addFiles(files){
  files = [...files];
  const lrcs = new Map(files.filter(f=>LRC_RE.test(f.name)).map(f=>[stripExt(f.name).toLowerCase(), f]));
  const list = files.filter(f => !LRC_RE.test(f.name) && (AUDIO_RE.test(f.name) || f.type.startsWith("audio/")));
  if (!list.length && !lrcs.size) return toast("No music files found there");
  if (list.length) toast(`Adding ${plural(list.length,"song")}…`);
  const seen = new Set(S.tracks.filter(t=>!t.path).map(t => t.name+"|"+t.size));
  let added = 0, ly = 0;
  for (const f of list){
    if (seen.has(f.name+"|"+f.size)) continue;
    const lf = lrcs.get(stripExt(f.name).toLowerCase());
    const m = await importOne(f, f.name, {lrc: lf ? await lf.text() : null});
    if (!m) continue;
    seen.add(f.name+"|"+f.size); added++;
    if (added % 10 === 0){ render(); renderSide(); }
  }
  // lyrics files for songs that are already in the library
  for (const [k,f] of lrcs){
    if (list.some(x => stripExt(x.name).toLowerCase()===k)) continue;
    const t = S.tracks.find(t => stripExt(t.name).toLowerCase()===k);
    if (t){ t.lrc = await f.text(); lyrCache.delete(t.id); persist(t); ly++; }
  }
  render(); renderSide(); storageInfo(); renderDrawer(); renderFs();
  toast(added ? `Added ${plural(added,"song")} ✓` : ly ? `Added lyrics for ${plural(ly,"song")} ✓` : "Those songs are already in your library");
}

/* ---------- music folder (desktop app keeps it in sync) ---------- */
const fetchFile = p => fetch("/__file?p="+encodeURIComponent(p)).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); });
let syncing = false, pendingSync = null;
async function syncFolder(files){
  if (syncing){ pendingSync = files; return; }
  syncing = true;
  try {
    const hidden = new Set(S.hidden.map(p=>p.toLowerCase()));
    const audioF = files.filter(f => AUDIO_RE.test(f.p) && !hidden.has(f.p.toLowerCase()));
    const lrcs = new Map(files.filter(f=>LRC_RE.test(f.p)).map(f=>[stripExt(f.p).toLowerCase(), f.p]));
    const want = new Map(audioF.map(f=>[f.p.toLowerCase(), f]));
    for (const t of S.tracks.filter(t=>t.path)){
      const f = want.get(t.path.toLowerCase());
      if (!f || f.s !== t.size) await dropTrack(t);
    }
    const have = new Set(S.tracks.filter(t=>t.path).map(t=>t.path.toLowerCase()));
    const todo = audioF.filter(f => !have.has(f.p.toLowerCase()));
    if (todo.length > 2) toast(`Scanning your music folder: ${plural(todo.length,"new song")}…`);
    let n = 0;
    for (const f of todo){
      try {
        const blob = await fetchFile(f.p), lp = lrcs.get(stripExt(f.p).toLowerCase());
        const lrc = lp ? await (await fetchFile(lp)).text() : null;
        if (await importOne(blob, baseName(f.p), {path:f.p, size:f.s, lrc})) n++;
        if (n % 15 === 0){ render(); renderSide(); }
      } catch {}
    }
    for (const t of S.tracks) if (t.path && !t.lrc){
      const lp = lrcs.get(stripExt(t.path).toLowerCase());
      if (lp) try { t.lrc = await (await fetchFile(lp)).text(); lyrCache.delete(t.id); persist(t); } catch {}
    }
    render(); renderSide(); storageInfo();
    if (n) toast(`Added ${plural(n,"song")} from your music folder ✓`);
  } finally {
    syncing = false;
    if (pendingSync){ const p = pendingSync; pendingSync = null; syncFolder(p); }
  }
}

/* ---------- removing ---------- */
async function dropTrack(t){
  await tx("meta","readwrite",s=>s.delete(t.id)).catch(()=>{});
  if (!t.path) await tx("blobs","readwrite",s=>s.delete(t.id)).catch(()=>{});
  if (t.coverUrl) URL.revokeObjectURL(t.coverUrl);
  S.tracks = S.tracks.filter(x => x !== t); S.map.delete(t.id);
  S.upNext = S.upNext.filter(i => i !== t.id); S.ctx = S.ctx.filter(i => i !== t.id);
  const qi = S.queue.indexOf(t.id);
  if (qi >= 0){ S.queue.splice(qi,1); if (qi <= S.idx) S.idx--; }
  if (S.currentId === t.id){ for (const e of els){ e.pause(); clearSrc(e); } S.currentId = null; renderNow(); renderCtrls(); renderDrawer(); }
}
async function removeTrack(t){
  const ok = await dialog({title:"Remove from library?", ok:"Remove", danger:true,
    text: t.path ? `“${t.title}” will be hidden from Offbeat. The file stays in your music folder.` : `“${t.title}” will be removed from Offbeat. The original file on your computer is not touched.`});
  if (!ok) return;
  if (t.path){ S.hidden.push(t.path); store.set("hiddenPaths", S.hidden); }
  await dropTrack(t);
  render(); renderSide(); storageInfo(); toast("Removed from your library");
}

/* ---------- audio engine: 2 players for crossfade → EQ → levelling → visualizer → volume ---------- */
const els = [new Audio(), new Audio()];
let audio = els[0];
const other = () => els[0]===audio ? els[1] : els[0];
const urls = new Map(), gains = new Map();
let actx, analyser, freq, eqNodes = [], comp, makeup, volGain, rafId, fadeT;
function initAudioGraph(){
  if (actx !== undefined) return;
  try {
    actx = new AudioContext();
    eqNodes = EQ_BANDS.map((f,i) => { const b = actx.createBiquadFilter(); b.type = i===0 ? "lowshelf" : i===4 ? "highshelf" : "peaking"; b.frequency.value = f; b.Q.value = 1; b.gain.value = cfg.eq[i]; return b; });
    for (let i=0;i<eqNodes.length-1;i++) eqNodes[i].connect(eqNodes[i+1]);
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -28; comp.knee.value = 24; comp.ratio.value = 5; comp.attack.value = .004; comp.release.value = .3;
    makeup = actx.createGain(); makeup.gain.value = 1.5; comp.connect(makeup);
    analyser = actx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .8;
    volGain = actx.createGain();
    analyser.connect(volGain); volGain.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    routeNorm();
    for (const el of els){ const g = actx.createGain(); actx.createMediaElementSource(el).connect(g); g.connect(eqNodes[0]); gains.set(el, g); el.volume = 1; }
    applyVol(+$("#vol").value);
  } catch { actx = null; }
}
function routeNorm(){
  if (!actx) return;
  const last = eqNodes[eqNodes.length-1];
  last.disconnect(); makeup.disconnect();
  if (cfg.norm){ last.connect(comp); makeup.connect(analyser); } else last.connect(analyser);
}
function applyVol(v){ const x = (v/100)**2; if (volGain) volGain.gain.value = x; else els.forEach(e => e.volume = x); }
function clearSrc(el){ el.removeAttribute("src"); el.load(); if (urls.get(el)){ URL.revokeObjectURL(urls.get(el)); urls.delete(el); } }
const getBlob = t => t.path ? fetchFile(t.path) : tx("blobs","readonly",s=>s.get(t.id));
const cur = () => S.map.get(S.currentId);

let loadSeq = 0, fadeStarted = false, playCounted = false, listenedThis = 0;
async function load({autoplay=true, at=0, fade=false} = {}){
  const t = cur(); if (!t) return;
  const seq = ++loadSeq;
  let blob; try { blob = await getBlob(t); } catch {}
  if (seq !== loadSeq) return;
  if (!blob){ toast(`Couldn't open “${t.title}” — the file is missing`); return; }
  if (autoplay) initAudioGraph();
  const useFade = fade && actx && cfg.xf > 0;
  const old = audio, el = useFade ? other() : audio;
  if (!useFade){ clearTimeout(fadeT); const o = other(); o.pause(); if (o.getAttribute("src")) clearSrc(o); }
  if (urls.get(el)) URL.revokeObjectURL(urls.get(el));
  const u = URL.createObjectURL(blob); urls.set(el, u); el.src = u;
  if (at) el.addEventListener("loadedmetadata", () => { el.currentTime = at; }, {once:true});
  const g = gains.get(el);
  if (useFade){
    const now = actx.currentTime, d = cfg.xf, og = gains.get(old);
    g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(1, now+d);
    og.gain.cancelScheduledValues(now); og.gain.setValueAtTime(og.gain.value, now); og.gain.linearRampToValueAtTime(0, now+d);
    audio = el;
    clearTimeout(fadeT); fadeT = setTimeout(() => { if (old !== audio){ old.pause(); clearSrc(old); } }, d*1000 + 250);
  } else if (g){ g.gain.cancelScheduledValues(0); g.gain.value = 1; }
  fadeStarted = false; playCounted = false; listenedThis = 0;
  if (autoplay) try { await el.play(); } catch {}
  onTrackChange(t);
}
function onTrackChange(t){
  flushDirty();
  renderNow(); markPlaying(); renderCtrls(); renderDrawer(); setDyn(t); mediaSession(t); saveSession();
  lyrIdx = -1;
}
function setContext(list, label, startId, key){
  S.ctx = list.map(t => t.id); S.ctxLabel = label; S.ctxKey = key; S.upNext = S.upNext.filter(id => S.map.has(id));
  S.currentId = startId; buildQueue(startId);
}
function buildQueue(curId){
  const inCtx = S.ctx.includes(curId);
  S.queue = S.shuffle ? (inCtx ? [curId, ...shuffleArr(S.ctx.filter(i => i !== curId))] : shuffleArr([...S.ctx])) : [...S.ctx];
  S.idx = inCtx ? S.queue.indexOf(curId) : -1;
}
function playFrom(list, label, id, key=S.view){ if (!list.length) return; setContext(list, label, id ?? list[0].id, key); load(); }
function advance(auto){
  while (S.upNext.length){ const id = S.upNext.shift(); if (S.map.has(id)) return S.currentId = id; }
  if (!S.queue.length) return null;
  if (S.idx+1 < S.queue.length) S.idx++;
  else if (S.repeat===1 || !auto){ if (S.shuffle) buildQueue(null); S.idx = 0; }
  else return null;
  return S.currentId = S.queue[S.idx];
}
function next(auto){
  if (!S.currentId) return;
  if (!advance(auto)){ audio.pause(); audio.currentTime = 0; renderCtrls(); return; }
  load();
}
function prev(){
  if (audio.currentTime > 3 || !S.queue.length){ audio.currentTime = 0; return; }
  S.idx = S.idx > 0 ? S.idx-1 : S.queue.length-1;
  S.currentId = S.queue[S.idx]; load();
}
function toggle(){
  if (!S.currentId){
    const info = viewInfo(), l = info.list?.length ? info.list : S.tracks;
    if (!l.length) return;
    return playFrom(l, info.list?.length ? info.title : "Songs", S.shuffle ? l[Math.floor(Math.random()*l.length)].id : l[0].id);
  }
  initAudioGraph();
  if (!audio.getAttribute("src")) return load();
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
}
function toggleShuffle(){ S.shuffle = !S.shuffle; store.set("shuffle", S.shuffle); if (S.ctx.length) buildQueue(S.currentId); renderCtrls(); renderDrawer(); toast(S.shuffle ? "Shuffle on" : "Shuffle off"); }
function cycleRepeat(){ S.repeat = (S.repeat+1)%3; store.set("repeat", S.repeat); renderCtrls(); toast(["Repeat off","Repeat all","Repeat one"][S.repeat]); }

let lastTick = 0, lastSave = 0;
for (const el of els){
  el.addEventListener("ended", e => {
    if (e.target !== audio) return;
    if (S.sleep?.end){ S.sleep = null; renderSleep(); audio.currentTime = 0; renderCtrls(); return toast("Sleep timer: music stopped. Good night 🌙"); }
    if (S.repeat===2){ audio.currentTime = 0; audio.play(); } else next(true);
  });
  el.addEventListener("play", e => { if (e.target !== audio) return; initAudioGraph(); actx?.resume(); lastTick = performance.now(); renderCtrls(); drawViz(); });
  el.addEventListener("pause", e => { if (e.target !== audio) return; renderCtrls(); saveSession(); });
  el.addEventListener("timeupdate", e => { if (e.target === audio) onTime(); });
}
function onTime(){
  const a = audio, t = cur(), d = a.duration || t?.duration || 0, now = performance.now();
  if (!seeking) updateProgress(a.currentTime, d);
  if (!a.paused && t){
    const dt = (now - lastTick)/1000;
    if (lastTick && dt > 0 && dt < 2.5) addListen(t, dt);
    lastTick = now;
    if (cfg.xf > 0 && actx && !fadeStarted && S.repeat !== 2 && !S.sleep?.end && d > cfg.xf*2+2 && d - a.currentTime <= cfg.xf){
      fadeStarted = true;
      if (advance(true)) load({fade:true});
    }
  }
  syncLyrics(a.currentTime);
  if (now - lastSave > 5000){ lastSave = now; saveSession(); }
}
let seeking = false;
function updateProgress(c, d){
  const p = d ? c/d*1000 : 0;
  $$(".js-seek").forEach(s => { s.value = p; s.style.setProperty("--p", p/10+"%"); });
  $$(".js-cur").forEach(x => x.textContent = fmt(c));
  $$(".js-dur").forEach(x => x.textContent = fmt(d));
}

/* ---------- listening stats ---------- */
function addListen(t, dt){
  t.listened += dt; listenedThis += dt; dirty.add(t.id);
  stats.total += dt; const k = today(); stats.days[k] = (stats.days[k]||0) + dt;
  if (!playCounted && listenedThis >= Math.min(30, (t.duration||60)/2)){ playCounted = true; t.plays++; }
}
function saveSession(){
  store.set("session", {ctx:S.ctx, queue:S.queue, idx:S.idx, cur:S.currentId, up:S.upNext, label:S.ctxLabel, key:S.ctxKey, time:audio.currentTime||0});
  const days = Object.keys(stats.days).sort(); while (days.length > 90) delete stats.days[days.shift()];
  store.set("stats", stats);
  flushDirty();
}
function restoreSession(){
  const ss = store.get("session", null);
  if (!ss || !S.map.has(ss.cur)) return;
  const ok = id => S.map.has(id);
  S.ctx = (ss.ctx||[]).filter(ok); S.queue = (ss.queue||[]).filter(ok); S.upNext = (ss.up||[]).filter(ok);
  S.ctxLabel = ss.label || ""; S.ctxKey = ss.key || ""; S.currentId = ss.cur; S.idx = S.queue.indexOf(ss.cur);
  load({autoplay:false, at:ss.time||0});
}
addEventListener("pagehide", saveSession);

/* ---------- media keys / Windows media overlay ---------- */
function mediaSession(t){
  send({type:"now", title:t.title, artist:t.artist, playing:!audio.paused});
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist, album:t.album,
    artwork: t.coverUrl ? [{src:t.coverUrl, sizes:"512x512", type:t.cover.type}] : []});
  const h = {play:()=>audio.play(), pause:()=>audio.pause(), nexttrack:()=>next(), previoustrack:prev};
  for (const k in h) try { navigator.mediaSession.setActionHandler(k, h[k]); } catch {}
}

/* ---------- visualizer ---------- */
let vz = {};
function readViz(){ const cs = getComputedStyle(root); vz = {a1:cs.getPropertyValue("--accent").trim(), a2:cs.getPropertyValue("--accent2").trim(), style:VIZ[S.theme]||"bars"}; }
function paint(c){
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio||1, W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
  if (!W || !H) return;
  if (c.width !== W || c.height !== H){ c.width = W; c.height = H; }
  const g = c.getContext("2d"); g.clearRect(0,0,W,H);
  const grad = g.createLinearGradient(0,0,W,0); grad.addColorStop(0,vz.a1); grad.addColorStop(1,vz.a2);
  g.fillStyle = grad; g.strokeStyle = grad;
  const n = Math.max(32, Math.min(96, Math.round(r.width/9))), step = W/n;
  const v = i => freq[Math.floor(i*(freq.length*.75)/n)]/255;
  if (vz.style==="wave"){
    g.lineWidth = 3*dpr; g.beginPath();
    for (let i=0;i<=n;i++){ const x=i*step, y=H-v(Math.min(i,n-1))*H*.95-2; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke(); g.lineTo(W,H); g.lineTo(0,H); g.globalAlpha=.18; g.fill(); g.globalAlpha=1;
  } else if (vz.style==="mirror"){
    g.shadowColor = vz.a1; g.shadowBlur = 14;
    for (let i=0;i<n;i++){ const h=Math.max(2,v(i)*H*.48); g.fillRect(i*step+1,H/2-h,step-3,h*2); }
    g.shadowBlur = 0;
  } else if (vz.style==="lines"){
    g.fillStyle = vz.a1;
    for (let i=0;i<n;i++){ const h=Math.max(1,v(i)*H); g.fillRect(i*step+step/2-dpr,H-h,2*dpr,h); }
  } else {
    for (let i=0;i<n;i++){ const h=Math.max(3,v(i)*H), x=i*step+1, w=step-3; g.beginPath(); g.roundRect ? g.roundRect(x,H-h,w,h,[3,3,0,0]) : g.rect(x,H-h,w,h); g.fill(); }
  }
}
function drawViz(){
  cancelAnimationFrame(rafId);
  if (!analyser) return;
  analyser.getByteFrequencyData(freq);
  $$("canvas.viz").forEach(c => { if (c.getClientRects().length) paint(c); });
  if (!audio.paused && !document.hidden) rafId = requestAnimationFrame(drawViz);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !audio.paused) drawViz(); });

/* ---------- colours from the album cover ---------- */
const dynCache = new Map();
async function coverTone(t){
  if (!t.coverUrl) return {h:hash(t.artist+t.title)%360, s:62};
  if (dynCache.has(t.id)) return dynCache.get(t.id);
  let res = {h:hash(t.artist+t.title)%360, s:50};
  try {
    const img = new Image(); img.src = t.coverUrl; await img.decode();
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const g = c.getContext("2d", {willReadFrequently:true}); g.drawImage(img,0,0,24,24);
    const d = g.getImageData(0,0,24,24).data; let r=0, gg=0, b=0, w=0;
    for (let i=0;i<d.length;i+=4){
      const R=d[i], G=d[i+1], B=d[i+2], mx=Math.max(R,G,B), mn=Math.min(R,G,B), sat = mx ? (mx-mn)/mx : 0;
      const wt = sat*sat*(mx/255) + .015; r+=R*wt; gg+=G*wt; b+=B*wt; w+=wt;
    }
    r/=w*255; gg/=w*255; b/=w*255;
    const mx = Math.max(r,gg,b), mn = Math.min(r,gg,b), dl = mx-mn, l = (mx+mn)/2;
    let h = 0;
    if (dl){ h = mx===r ? ((gg-b)/dl)%6 : mx===gg ? (b-r)/dl+2 : (r-gg)/dl+4; h = (h*60+360)%360; }
    const s = dl ? dl/(1-Math.abs(2*l-1)) : 0;
    res = {h:Math.round(h), s:Math.round(Math.max(18, Math.min(80, s*100)))};
  } catch {}
  dynCache.set(t.id, res);
  return res;
}
async function setDyn(t){
  if (!cfg.dyn || !t){ root.style.removeProperty("--dh"); root.style.removeProperty("--ds"); return; }
  const {h,s} = await coverTone(t);
  if (cur() !== t) return;
  root.style.setProperty("--dh", h); root.style.setProperty("--ds", s+"%");
}

/* ---------- lyrics (.lrc synced, or plain text) ---------- */
const lyrCache = new Map();
function lyrics(t){
  if (!t?.lrc) return null;
  if (lyrCache.has(t.id)) return lyrCache.get(t.id);
  const lines = []; let synced = false;
  for (const raw of t.lrc.split(/\r?\n/)){
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)], x = raw.replace(/\[[^\]]*\]/g,"").trim();
    if (tags.length){ synced = true; for (const m of tags) lines.push({t:+m[1]*60 + parseFloat(m[2].replace(":",".")), x}); }
    else if (!/^\s*\[/.test(raw)) lines.push({t:null, x});
  }
  const L = synced ? {synced, lines:lines.filter(l=>l.t!==null).sort((a,b)=>a.t-b.t)} : {synced, lines:lines.filter((l,i,a)=>l.x||a[i-1]?.x)};
  lyrCache.set(t.id, L);
  return L;
}
function lyricsHTML(t){
  if (!t) return `<div class="empty sm"><h3 class="head">Nothing playing</h3><p>Lyrics show up here while a song plays.</p></div>`;
  const L = lyrics(t);
  if (!L || !L.lines.length) return `<div class="empty sm"><h3 class="head">No lyrics yet</h3><p>Put a <b>.lrc</b> file with the same name next to the song, or add one now.</p><div class="btns"><button class="btn ghost sm" data-cmd="addlrc">${icon("plus")}Add lyrics file</button></div></div>`;
  return `<div class="lyr${L.synced?"":" plain"}">` + L.lines.map((l,i)=>`<p data-li="${i}">${esc(l.x)||"♪"}</p>`).join("") + `</div>`;
}
let lyrIdx = -1;
function syncLyrics(time, force){
  const L = lyrics(cur());
  if (!L || !L.synced) return;
  let i = -1;
  for (let k=0;k<L.lines.length;k++){ if (L.lines[k].t <= time+.25) i = k; else break; }
  if (i === lyrIdx && !force) return;
  lyrIdx = i;
  $$(".lyr").forEach(box => {
    box.querySelectorAll("p.on").forEach(p => p.classList.remove("on"));
    const p = box.querySelector(`p[data-li="${i}"]`), sc = box.parentElement;
    if (!p) return;
    p.classList.add("on");
    sc.scrollTo({top: p.offsetTop - sc.clientHeight*.38, behavior: force ? "auto" : "smooth"});
  });
}

/* ---------- views ---------- */
function groups(kind){
  const m = new Map();
  for (const t of S.tracks){
    const name = kind==="album" ? t.album : t.artist; if (!name) continue;
    const k = name.toLowerCase(); let g = m.get(k);
    if (!g) m.set(k, g = {name, tracks:[]});
    g.tracks.push(t);
  }
  return [...m.values()].sort((a,b) => cmp(a.name,b.name));
}
const byAlbum = (a,b) => cmp(a.album,b.album) || (a.no||999)-(b.no||999) || cmp(a.title,b.title);
function viewInfo(v=S.view){
  const q = S.q.toLowerCase(), match = t => !q || (t.title+" "+t.artist+" "+t.album).toLowerCase().includes(q);
  const sorted = l => { l = l.filter(match);
    if (S.sort==="title") return l.sort((a,b)=>cmp(a.title,b.title));
    if (S.sort==="artist") return l.sort((a,b)=>cmp(a.artist,b.artist)||byAlbum(a,b));
    if (S.sort==="album") return l.sort(byAlbum);
    return l.sort((a,b)=>b.added-a.added); };
  if (v==="all") return {kind:"list", title:"Songs", list:sorted([...S.tracks]), sortable:true};
  if (v==="liked") return {kind:"list", title:"Liked songs", list:sorted(S.tracks.filter(t=>t.liked)), sortable:true};
  if (v==="top") return {kind:"list", title:"Most played", list:S.tracks.filter(t=>t.plays>0&&match(t)).sort((a,b)=>b.plays-a.plays||b.listened-a.listened).slice(0,100)};
  if (v==="albums" || v==="artists"){
    const kind = v==="albums" ? "album" : "artist";
    const items = groups(kind).filter(g => !q || g.name.toLowerCase().includes(q)).map(g => {
      const counts = {}; g.tracks.forEach(t => counts[t.artist] = (counts[t.artist]||0)+1);
      const by = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
      return {name:g.name, view:kind+":"+encodeURIComponent(g.name), round:kind==="artist", cover:g.tracks.find(t=>t.coverUrl)||g.tracks[0],
              sub: kind==="album" ? `${by} · ${plural(g.tracks.length,"song")}` : plural(g.tracks.length,"song")};
    });
    return {kind:"grid", title:kind==="album"?"Albums":"Artists", items};
  }
  if (v.startsWith("album:") || v.startsWith("artist:")){
    const [kind, enc] = v.split(/:(.*)/s), name = decodeURIComponent(enc), key = name.toLowerCase();
    const list = S.tracks.filter(t => (kind==="album"?t.album:t.artist).toLowerCase()===key && match(t)).sort(byAlbum);
    return {kind:"list", title:name, list, back: kind==="album" ? "albums" : "artists"};
  }
  if (v.startsWith("pl:")){
    const p = S.playlists.find(p => "pl:"+p.id === v);
    if (!p) return {kind:"list", title:"Playlist", list:[]};
    return {kind:"list", title:p.name, list:p.ids.map(id=>S.map.get(id)).filter(t=>t&&match(t)), pl:p};
  }
  if (v==="stats") return {kind:"page", title:"Your stats"};
  if (v==="settings") return {kind:"page", title:"Settings"};
  return viewInfo("all");
}
function go(v){
  S.view = v; S.q = ""; $("#q").value = "";
  closeMenu(); render(); renderSide();
  $("#main").scrollTo({top:0});
}

const emptyHTML = (h, p, btns="") => `<div class="empty"><h3 class="head">${h}</h3><p>${p}</p>${btns?`<div class="btns">${btns}</div>`:""}</div>`;
function render(){
  const info = viewInfo(), body = $("#body");
  $("#main").classList.toggle("nohero", info.kind==="page");
  $("#viewTitle").textContent = info.title;
  $("#back").hidden = !info.back;
  $("#playAll").hidden = info.kind!=="list" || !info.list.length;
  $("#searchBox").hidden = info.kind==="page";
  $("#sort").hidden = !info.sortable;

function renderDrawer(){
  $("#app").classList.toggle("drawer-on", !!S.drawer);

  if (!t){ body.innerHTML = `<div class="empty sm"><h3 class="head">Nothing playing yet</h3><p>Play a song and your queue shows up here.</p></div>`; return; }
  const qrow = (x, kind, i) => `<div class="qrow${kind==="now"?" on":""}" data-q="${kind}" data-i="${i}">${art(x)}<div><div class="tt">${esc(x.title)}</div><div class="ta">${esc(x.artist)}</div></div>${kind==="up"?`<button class="ib" data-qx="${i}" title="Remove">${icon("x")}</button>`:""}</div>`;

}

/* ---------- stats page ---------- */
function statsHTML(){
  const played = S.tracks.filter(t => t.plays > 0);
  if (!played.length && stats.total < 60) return `<div class="page"><h1 class="head">Your stats</h1>${emptyHTML("Start listening", "Play some music and your personal stats appear here — top songs, top artists and how much you've listened.")}</div>`;
  const plays = S.tracks.reduce((a,t)=>a+t.plays,0);
  const topSongs = [...played].sort((a,b)=>b.listened-a.listened).slice(0,5);
  const artists = {}; for (const t of S.tracks) if (t.listened > 0){ const a = artists[t.artist] ||= {name:t.artist, sec:0, plays:0, t}; a.sec += t.listened; a.plays += t.plays; if (t.coverUrl && !a.t.coverUrl) a.t = t; }
  const topArtists = Object.values(artists).sort((a,b)=>b.sec-a.sec).slice(0,5);
  const days = [...Array(14)].map((_,i) => { const d = new Date(); d.setDate(d.getDate()-13+i); return {k:today(d), d}; });
  const mx = Math.max(60, ...days.map(x => stats.days[x.k]||0));
  const top = topSongs[0];
  const since = new Date(stats.since).toLocaleDateString(undefined, {day:"numeric", month:"long", year:"numeric"});
  return `<div class="page"><h1 class="head">Your stats</h1>
    <div class="scards">
      <div class="scard"><b>${(stats.total/3600).toFixed(stats.total<36000?1:0)}</b><span>hours listened</span></div>
      <div class="scard"><b>${plays}</b><span>plays</span></div>
      <div class="scard"><b>${played.length}</b><span>different songs</span></div>
      <div class="scard"><b>${Object.keys(artists).length}</b><span>artists</span></div>
    </div>
    ${top ? `<div class="topsong">${art(top)}<div style="min-width:0"><small>Your #1 song</small><h2 class="head">${esc(top.title)}</h2><div class="muted">${esc(top.artist)} · ${plural(top.plays,"play")} · ${fmtLong(top.listened)}</div></div></div>` : ""}
    <div class="cols">
      <div class="sec"><h3 class="head">Top songs</h3>${topSongs.map((t,i)=>`<div class="rank"><i>${i+1}</i>${art(t)}<div><div class="tt">${esc(t.title)}</div><div class="ta">${esc(t.artist)}</div></div><span class="v">${plural(t.plays,"play")}</span></div>`).join("")}</div>
      <div class="sec"><h3 class="head">Top artists</h3>${topArtists.map((a,i)=>`<div class="rank"><i>${i+1}</i><div style="flex:none">${art(a.t).replace('class="art','style="border-radius:50%" class="art')}</div><div><div class="tt">${esc(a.name)}</div><div class="ta">${fmtLong(a.sec)}</div></div><span class="v">${plural(a.plays,"play")}</span></div>`).join("")}</div>
    </div>
    <div class="sec"><h3 class="head">Last 14 days</h3>
      <div class="chart">${days.map(x => `<div style="height:${Math.max(2,(stats.days[x.k]||0)/mx*100)}%" title="${x.d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}: ${fmtLong(stats.days[x.k]||0)}"></div>`).join("")}</div>
      <div class="chart-l">${days.map(x => `<span>${x.d.toLocaleDateString(undefined,{weekday:"narrow"})}</span>`).join("")}</div></div>
    <p class="muted" style="font-size:12px">Counting since ${since}. A song counts as played after 30 seconds.</p></div>`;

function dialog({title, text="", input=null, ok="OK", danger=false}){
  return new Promise(res => {
    const d = $("#dlg");
    d.innerHTML = `<div class="dlg-in"><h3 class="head">${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:""}${input!==null?`<input id="dlgIn" maxlength="80" value="${esc(input)}">`:""}
      <div class="btns"><button class="btn ghost" data-r="0">Cancel</button><button class="btn${danger?" danger":""}" data-r="1">${esc(ok)}</button></div></div>`;
    d.classList.add("on");
    const inp = $("#dlgIn"); (inp || d.querySelector('[data-r="1"]')).focus(); inp?.select();
    const done = v => { d.classList.remove("on"); d.onclick = d.onkeydown = null; res(v); };
    const val = () => inp ? (inp.value.trim() || null) : true;
    d.onclick = e => { const b = e.target.closest("[data-r]"); if (b) done(b.dataset.r==="1" ? val() : null); else if (e.target===d) done(null); };
    d.onkeydown = e => { e.stopPropagation(); if (e.key==="Enter"){ e.preventDefault(); done(val()); } if (e.key==="Escape") done(null); };
  });
}

/* ---------- playlists ---------- */
async function newPlaylist(ids=[]){
  const name = await dialog({title:"New playlist", input:`My playlist #${S.playlists.length+1}`, ok:"Create"});
  if (!name) return;
  const p = {id:uid(), name, ids:[...ids], created:Date.now()};
  S.playlists.push(p); await savePl(p);
  renderSide(); toast(ids.length ? `Added to “${name}”` : `Created “${name}”`);
  if (!ids.length) go("pl:"+p.id);
}
function addToPlaylist(p, ids){
  const add = ids.filter(id => !p.ids.includes(id));
  if (!add.length) return toast(`Already in “${p.name}”`);
  p.ids.push(...add); savePl(p); renderSide();
  if (S.view==="pl:"+p.id) render();
  toast(`Added to “${p.name}”`);
}

  const r = btn.getBoundingClientRect();

  openMenu(r.left-150, r.top-8, [{head:"Sleep timer"},
    ...[[15,"15 minutes"],[30,"30 minutes"],[45,"45 minutes"],[60,"1 hour"],[90,"1.5 hours"]].map(([m,label]) => ({label, icon:"moon", run:set({at:Date.now()+m*60000, label})})),
    {label:"End of this song", icon:"note", run:set({end:true})},
    ...(S.sleep ? ["-", {label:"Turn off", icon:"x", run:set(null)}] : [])]);

function renderSleep(){
  const b = $(".js-sleep"); b.classList.toggle("on", !!S.sleep);
  b.querySelector(".badge").textContent = !S.sleep ? "" : S.sleep.end ? "♪" : Math.max(1, Math.ceil((S.sleep.at-Date.now())/60000)) + "m";
}
let sleeping = false;
setInterval(async () => {
  if (!S.sleep?.at) return;
  renderSleep();
  if (Date.now() < S.sleep.at || sleeping) return;
  sleeping = true; S.sleep = null; renderSleep();
  const v = +$("#vol").value;
  for (let i=20;i>=0;i--){ applyVol(v*i/20); await wait(300); }
  audio.pause(); applyVol(v); sleeping = false;
  toast("Sleep timer: music stopped. Good night 🌙");
}, 1000);

function setLike(t){

  toast(t.liked ? "Added to Liked songs" : "Removed from Liked songs");

/* ---------- volume ---------- */
const vol = $("#vol");
let lastVol = store.get("vol", 80);
function setVol(v, save=true){
  applyVol(v); vol.value = v; vol.style.setProperty("--p", v+"%");
  $(".js-mute").innerHTML = icon(+v===0 ? "mute" : "vol");
  if (save && v > 0){ store.set("vol", v); lastVol = v; }
